# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: vvnt/carnets
  branch: main

site_url: https://vvnt.github.io/carnets/
display_url: https://vvnt.github.io/carnets/
locale: fr

# Pas d'images sur ce site ; dossier prévu si l'on en ajoute un jour.
media_folder: static/images
public_folder: /carnets/images

collections:
  - name: journal
    label: Journal
    label_singular: Note du jour
    folder: content/journal
    extension: md
    format: frontmatter
    index_file: true
    create: true
    # Le nom du fichier fournit la date : AAAA_MM_JJ.md
    slug: "{{year}}_{{month}}_{{day}}"
    sortable_fields: [date]
    fields:
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Le nom du fichier suit la date (AAAA_MM_JJ)." }
      - { name: title, label: Titre (facultatif), widget: string, required: false }
      - { name: body, label: Notes, widget: markdown, modes: [raw], hint: "Séparez les notes d'un même jour par une ligne ---." }

  - name: ndl
    label: Notes de lecture
    label_singular: Note de lecture
    folder: content/ndl
    extension: md
    format: frontmatter
    index_file: true
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{author}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: subtitle, label: Sous-titre, widget: string, required: false }
      - { name: author, label: Auteur, widget: string }
      - { name: abstract, label: Résumé, widget: text, required: false }
      - { name: tags, label: Mots-clés, widget: list, required: false }
      - { name: body, label: Note, widget: markdown }

  - name: dictionnaires
    label: Dictionnaires
    label_singular: Dictionnaire
    folder: content/dictionnaires
    extension: md
    format: frontmatter
    index_file: true
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: description, label: Description, widget: string, required: false }
      - { name: body, label: Entrées, widget: markdown, modes: [raw], hint: "Un titre de niveau 1 (# A) par lettre ; entrées au format « terme » puis « : définition »." }

  - name: pages
    label: Pages
    files:
      - name: accueil
        label: Accueil
        file: content/_index.md
        fields:
          - { name: title, label: Titre, widget: string }
          - { name: body, label: Texte, widget: markdown }
      - name: anthologie
        label: Anthologie de la poésie
        file: content/anthologie.md
        fields:
          - { name: title, label: Titre, widget: string }
          - { name: type, label: Type, widget: hidden, default: anthologie }
          - { name: body, label: Poèmes, widget: markdown, modes: [raw], hint: "## Auteur puis ### Poème ; un vers par ligne." }
      - name: citations
        label: Citations
        file: content/citations.md
        fields:
          - { name: title, label: Titre, widget: string }
          - { name: type, label: Type, widget: hidden, default: citations }
          - { name: body, label: Citations, widget: markdown, modes: [raw], hint: "Séparez les citations par une ligne ---." }
      - name: a-propos
        label: À propos
        file: content/a-propos.md
        fields:
          - { name: title, label: Titre, widget: string }
          - { name: body, label: Texte, widget: markdown }
